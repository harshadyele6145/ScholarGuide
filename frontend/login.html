<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholarGuide - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            color: #2563eb;
            margin-bottom: 8px;
        }

        .logo p {
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }

        .register-link a {
            color: #2563eb;
            cursor: pointer;
            font-weight: 600;
        }

        #registerForm {
            display: none;
        }
    </style>
</head>

<body>

<div class="login-container">

    <!-- LOGIN -->
    <div class="login-card" id="loginForm">

        <div class="logo">
            <h1>ScholarGuide</h1>
            <p>Admin Login</p>
        </div>

        <form id="loginFormElement">

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <div id="loginMessage" class="message"></div>

        <div class="register-link">
            Don't have an admin account?
            <a id="showRegister">Register</a>
        </div>

    </div>


    <!-- REGISTER -->
    <div class="login-card" id="registerForm">

        <div class="logo">
            <h1>ScholarGuide</h1>
            <p>Create Admin Account</p>
        </div>

        <form id="registerFormElement">

            <div class="form-group">
                <label>Name</label>
                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    required
                >
            </div>

            <button type="submit">
                Register
            </button>

        </form>

        <div id="registerMessage" class="message"></div>

        <div class="register-link">
            Already have an account?
            <a id="showLogin">Login</a>
        </div>

    </div>

</div>


<script src="api-config.js"></script>
<script>

    // Set window.SCHOLARGUIDE_API_URL in api-config.js for a deployed backend.
    const API_BASE = `${(window.SCHOLARGUIDE_API_URL || (window.location.protocol === "file:" ? "http://localhost:5000" : window.location.origin)).replace(/\/$/, "")}/api`;


    // =========================
    // LOGIN
    // =========================

    document
        .getElementById("loginFormElement")
        .addEventListener("submit", async function (e) {

            e.preventDefault();

            const email =
                document.getElementById("loginEmail").value.trim();

            const password =
                document.getElementById("loginPassword").value;

            const message =
                document.getElementById("loginMessage");

            message.className = "message";
            message.textContent = "Logging in...";

            try {

                const response = await fetch(
                    `${API_BASE}/auth/login`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email,
                            password
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok || !data.success) {

                    message.className =
                        "message error";

                    message.textContent =
                        data.message || "Login failed";

                    return;
                }

                // Save authentication
                sessionStorage.setItem(
                    "token",
                    data.token
                );

                sessionStorage.setItem(
                    "user",
                    JSON.stringify(data.user)
                );

                message.className =
                    "message success";

                message.textContent =
                    "Login successful. Redirecting...";

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 500);

            } catch (error) {

                console.error("Login error:", error);

                message.className =
                    "message error";

                message.textContent =
                    "Cannot reach ScholarGuide. Start the backend, then open http://localhost:5000.";
            }

        });


    // =========================
    // REGISTER
    // =========================

    document
        .getElementById("registerFormElement")
        .addEventListener("submit", async function (e) {

            e.preventDefault();

            const name =
                document.getElementById("registerName").value.trim();

            const email =
                document.getElementById("registerEmail").value.trim();

            const password =
                document.getElementById("registerPassword").value;

            const message =
                document.getElementById("registerMessage");

            message.className = "message";
            message.textContent = "Creating account...";

            try {

                const response = await fetch(
                    `${API_BASE}/auth/register`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            name,
                            email,
                            password
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok || !data.success) {

                    message.className =
                        "message error";

                    message.textContent =
                        data.message || "Registration failed";

                    return;
                }

                message.className =
                    "message success";

                message.textContent =
                    "Registration successful. Please login.";

                setTimeout(() => {

                    document
                        .getElementById("registerForm")
                        .style.display = "none";

                    document
                        .getElementById("loginForm")
                        .style.display = "block";

                }, 1000);

            } catch (error) {

                console.error("Registration error:", error);

                message.className =
                    "message error";

                message.textContent =
                    "Cannot reach ScholarGuide. Start the backend, then open http://localhost:5000.";
            }

        });


    // =========================
    // SWITCH LOGIN / REGISTER
    // =========================

    document
        .getElementById("showRegister")
        .addEventListener("click", function () {

            document
                .getElementById("loginForm")
                .style.display = "none";

            document
                .getElementById("registerForm")
                .style.display = "block";

        });


    document
        .getElementById("showLogin")
        .addEventListener("click", function () {

            document
                .getElementById("registerForm")
                .style.display = "none";

            document
                .getElementById("loginForm")
                .style.display = "block";

        });

</script>

</body>
</html>
